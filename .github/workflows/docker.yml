name: Docker CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose
        run: docker compose config
      - name: Build image
        run: docker build -t yt-dlp-server:test .
      - name: Smoke-test installed tools
        run: |
          docker run --rm yt-dlp-server:test python -m py_compile /app/app.py /app/staging.py /app/tools/repair_legacy_imports.py
          docker run --rm yt-dlp-server:test yt-dlp --version
          docker run --rm yt-dlp-server:test deno --version
          docker run --rm yt-dlp-server:test ffmpeg -version
          docker run --rm yt-dlp-server:test sh -c 'spotdl --version | grep -qx 4.5.2'
          docker run --rm --user 1000:1000 yt-dlp-server:test sh -c 'test -w "$HOME" && spotdl --version | grep -qx 4.5.2'
          docker run --rm yt-dlp-server:test python -c "import importlib.metadata; assert importlib.metadata.version('bgutil-ytdlp-pot-provider') == '2.0.0'"
          docker run --rm --user 1000:1000 yt-dlp-server:test sh -c 'test -f /opt/bgutil-ytdlp-pot-provider/server/src/generate_once.ts && deno run --allow-env --allow-net --allow-ffi=/opt/bgutil-ytdlp-pot-provider/server/node_modules --allow-write=/tmp/yt-dlp-cache/bgutil-ytdlp-pot-provider --allow-read=/tmp/yt-dlp-cache/bgutil-ytdlp-pot-provider,/opt/bgutil-ytdlp-pot-provider/server/node_modules /opt/bgutil-ytdlp-pot-provider/server/src/generate_once.ts --version | grep -qx 2.0.0'
      - name: Validate Chrome extension
        run: |
          python -m json.tool chrome-extension/manifest.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("chrome-extension/manifest.json").read_text())
          assert manifest["manifest_version"] == 3
          assert manifest["background"]["service_worker"] == "service-worker.js"
          assert manifest["options_page"] == "options.html"
          assert set(manifest["permissions"]) == {
              "activeTab", "contextMenus", "scripting", "storage"
          }
          assert "http://*/*" in manifest["optional_host_permissions"]
          assert "https://*/*" in manifest["optional_host_permissions"]

          worker = Path("chrome-extension/service-worker.js").read_text()
          assert 'contexts: ["link", "selection"]' in worker
          assert 'body.set("playlist", "on")' in worker
          assert '"/api/probe"' in worker
          assert '"/download"' in worker
          assert "MAX_SELECTION_URLS = 20" in worker
          assert "range.intersectsNode(anchor)" in worker

          options = Path("chrome-extension/options.js").read_text()
          assert "chrome.permissions.request" in options
          assert '"/health"' in options
          PY
          docker run --rm \
            -v "$PWD/chrome-extension:/extension:ro" \
            yt-dlp-server:test deno eval \
            'new Function(await Deno.readTextFile("/extension/service-worker.js")); new Function(await Deno.readTextFile("/extension/options.js"));'
      - name: Validate packaged Chrome extension ZIP
        run: |
          test -s dist/yt-dlp-server-chrome-extension-v1.0.0.zip
          unzip -t dist/yt-dlp-server-chrome-extension-v1.0.0.zip
          tmp="$(mktemp -d)"
          unzip -q dist/yt-dlp-server-chrome-extension-v1.0.0.zip -d "$tmp"
          for file in manifest.json service-worker.js options.html options.js README.md; do
            cmp "chrome-extension/$file" "$tmp/$file"
          done
          test -f "$tmp/manifest.json"
          python -m json.tool "$tmp/manifest.json" >/dev/null
      - name: Validate site extension download
        run: |
          grep -q "download_chrome_extension" templates/index.html
          grep -q "Chrome extension" templates/index.html
          grep -q "COPY dist ./dist" Dockerfile
          docker run --rm --user 1000:1000 \
            -e MUSIC_ROOT=/tmp/music \
            -e STATE_DIR=/tmp/state \
            -e TEMP_DIR=/tmp/work \
            yt-dlp-server:test python - <<'PY'
          import app

          assert app.CHROME_EXTENSION_ZIP.is_file(), app.CHROME_EXTENSION_ZIP
          client = app.app.test_client()
          response = client.get("/chrome-extension.zip")
          assert response.status_code == 200, response.data
          assert response.data[:2] == b"PK", response.data[:16]
          disposition = response.headers.get("Content-Disposition", "")
          assert "attachment" in disposition.lower(), disposition
          assert "yt-dlp-server-chrome-extension-v1.0.0.zip" in disposition, disposition
          assert response.mimetype == "application/zip", response.mimetype
          PY
      - name: Validate Plex post-publish nudge
        run: |
          docker run --rm --user 1000:1000 \
            -e MUSIC_ROOT=/tmp/music \
            -e STATE_DIR=/tmp/state \
            -e TEMP_DIR=/tmp/work \
            -e PLEX_RESCAN_NUDGE_SECONDS=90 \
            yt-dlp-server:test python - <<'PY'
          import pathlib
          import tempfile
          import time

          import app

          root = pathlib.Path(tempfile.mkdtemp())
          app.IMPORT_ROOT = root / "YT-DLP Imports"
          app.IMPORT_ROOT.mkdir(parents=True)

          before = app.IMPORT_ROOT.stat().st_mtime_ns
          time.sleep(0.01)
          app._emit_library_change_nudge()
          after = app.IMPORT_ROOT.stat().st_mtime_ns

          assert after >= before
          assert not list(app.IMPORT_ROOT.glob(".yt-dlp-refresh-*"))

          # Debouncing replaces an older scheduled nudge instead of spawning
          # one timer for every album in a batch.
          class FakeTimer:
              created = []
              def __init__(self, seconds, fn):
                  self.seconds = seconds
                  self.fn = fn
                  self.cancelled = False
                  self.daemon = False
                  FakeTimer.created.append(self)
              def start(self):
                  pass
              def cancel(self):
                  self.cancelled = True

          real_timer = app.threading.Timer
          app.threading.Timer = FakeTimer
          app.library_nudge_timer = None
          try:
              app.schedule_library_change_nudge(delay=90)
              first = app.library_nudge_timer
              app.schedule_library_change_nudge(delay=90)
              second = app.library_nudge_timer
          finally:
              app.threading.Timer = real_timer
              app.library_nudge_timer = None

          assert first is not second
          assert first.cancelled is True
          assert second.seconds == 90
          PY
      - name: Validate non-root runtime, naming and playlist classification
        run: |
          docker run --rm --user 1000:1000 \
            -e MUSIC_ROOT=/tmp/music \
            -e STATE_DIR=/tmp/state \
            -e TEMP_DIR=/tmp/work \
            yt-dlp-server:test python -c 'import app, yt_dlp; y=yt_dlp.YoutubeDL({"outtmpl": app.OUTPUT_TEMPLATE}); p=y.prepare_filename({"id":"abc123","title":"Fallback title","ext":"webm","artist":"Test Artist","album":"Test Album","track":"Test Track","track_number":1}); assert "/" not in p, p; assert p.endswith("Test Track [abc123].webm"), p; q=y.prepare_filename({"id":"def456","title":"Loose Song","ext":"m4a","uploader":"Test Uploader"}); assert "/" not in q and q.endswith("Loose Song [def456].m4a"), q; assert "Test Uploader" not in q; assert app.classify_probe_info({"_type":"playlist","title":"Album","playlist_count":12}) == {"kind":"playlist","title":"Album","count":12,"extractor":None,"album_mode":False,"album_artist":None,"thumbnail":None}; assert app.classify_probe_info({"_type":"video","title":"Track"})["kind"] == "single"; assert app.classify_probe_info({"_type":"playlist","title":"Release"}, url="https://example.bandcamp.com/album/release")["album_mode"] is True; assert app.classify_probe_info({"_type":"playlist","title":"Mix"}, url="https://youtube.com/playlist?list=PL123")["album_mode"] is False; print(p); print(q)'
      - name: Validate release card metadata
        run: |
          docker run --rm --user 1000:1000 \
            -e MUSIC_ROOT=/tmp/music \
            -e STATE_DIR=/tmp/state \
            -e TEMP_DIR=/tmp/work \
            yt-dlp-server:test python - <<'PY'
          import app

          info = {
              "_type": "playlist",
              "title": "Album Title",
              "playlist_count": 9,
              "album": "Album Title",
              "album_artist": "Album Artist",
              "thumbnail": "https://example.invalid/cover.jpg",
          }
          result = app.classify_probe_info(
              info,
              url="https://music.youtube.com/playlist?list=OLAK5uy_test",
          )
          assert result["title"] == "Album Title", result
          assert result["album_artist"] == "Album Artist", result
          assert result["thumbnail"] == "https://example.invalid/cover.jpg", result

          # Prefer the last available thumbnail when no canonical thumbnail
          # field is supplied.
          assert app.best_thumbnail_url({
              "thumbnails": [
                  {"url": "https://example.invalid/small.jpg"},
                  {"url": "https://example.invalid/large.jpg"},
              ]
          }) == "https://example.invalid/large.jpg"

          assert app.best_thumbnail_url({
              "entries": [{"id": "VIMmyFY13Uk"}]
          }) == "https://i.ytimg.com/vi/VIMmyFY13Uk/hqdefault.jpg"

          raw = {
              "id": "card1",
              "url": "https://example.invalid/album",
              "status": "queued",
              "source": "yt-dlp",
              "playlist": True,
              "album_mode": True,
              "source_title": "Visible Album",
              "source_album_artist": "Visible Artist",
              "source_thumbnail": "https://example.invalid/art.jpg",
          }
          job = app.normalize_persisted_job(raw)
          app.jobs.clear()
          app.jobs[job["id"]] = job
          public = app.public_jobs()[0]
          assert public["source_title"] == "Visible Album", public
          assert public["source_album_artist"] == "Visible Artist", public
          assert public["source_thumbnail"] == "https://example.invalid/art.jpg", public

          # Retries and manual resolution children are one logical request.
          app.jobs.clear()
          parent = app.normalize_persisted_job({
              "id": "root1",
              "url": "https://example.invalid/album",
              "status": "failed",
              "source": "spotify",
              "playlist": False,
              "attempt": 1,
              "source_title": "One Album",
              "source_thumbnail": "https://example.invalid/one.jpg",
              "missing_tracks": [{
                  "spotify_url": "https://open.spotify.com/track/abc123",
                  "label": "Missing Track",
                  "resolved": False,
                  "source_url": None,
              }],
          })
          retry = app.normalize_persisted_job({
              "id": "retry1",
              "url": "https://example.invalid/album",
              "status": "failed",
              "source": "spotify",
              "playlist": False,
              "attempt": 2,
              "retry_of": "root1",
              "message": "Latest retry failed",
          })
          resolution = app.normalize_persisted_job({
              "id": "resolution1",
              "url": "https://open.spotify.com/track/abc123",
              "status": "running",
              "source": "spotify",
              "playlist": False,
              "resolution_of": "root1",
              "spotify_track_url": "https://open.spotify.com/track/abc123",
          })
          app.jobs.update({
              parent["id"]: parent,
              retry["id"]: retry,
              resolution["id"]: resolution,
          })
          grouped = app.public_jobs()
          assert len(grouped) == 1, grouped
          card = grouped[0]
          assert card["id"] == "retry1", card
          assert card["request_id"] == "root1", card
          assert card["attempt_count"] == 2, card
          assert len(card["request_member_ids"]) == 3, card
          assert card["source_title"] == "One Album", card
          assert card["source_thumbnail"] == "https://example.invalid/one.jpg", card
          assert card["active_resolution_tracks"] == [
              "https://open.spotify.com/track/abc123"
          ], card

          # Existing Spotify jobs are backfilled asynchronously from oEmbed.
          app.jobs.clear()
          spotify = app.normalize_persisted_job({
              "id": "spotify-old",
              "url": "https://open.spotify.com/album/abc123",
              "status": "failed",
              "source": "spotify",
          })
          app.jobs[spotify["id"]] = spotify
          real_probe = app.probe_spotify_url
          app.probe_spotify_url = lambda url: {
              "kind": "spotify",
              "title": "The Book of Sounds",
              "count": None,
              "extractor": "Spotify oEmbed",
              "album_mode": True,
              "album_artist": None,
              "thumbnail": "https://example.invalid/spotify.jpg",
          }
          try:
              app.backfill_job_display_metadata()
          finally:
              app.probe_spotify_url = real_probe
          public = app.public_jobs()[0]
          assert public["source_title"] == "The Book of Sounds", public
          assert public["source_thumbnail"] == "https://example.invalid/spotify.jpg", public
          PY
      - name: Validate album grouping and item progress
        run: |
          docker run --rm --user 1000:1000 \
            -e MUSIC_ROOT=/tmp/music \
            -e STATE_DIR=/tmp/state \
            -e TEMP_DIR=/tmp/work \
            yt-dlp-server:test python -c 'import app; u="https://www.youtube.com/playlist?list=OLAK5uy_n5KJL2xyuNKuuMogjJPznLK7ao25VhprU"; assert app.is_youtube_album_playlist(u); assert not app.is_youtube_album_playlist("https://www.youtube.com/playlist?list=PL123"); info={"entries":[{"uploader":"Artist A - Topic"},{"uploader":"Artist B - Topic"}]}; assert app.infer_album_artist(info)=="Various Artists"; j={"id":"album1","staging_owner_id":"album1","playlist":True,"album_mode":True,"compilation":True,"force":False,"url":u}; cmd=app.build_command(j); assert not any("playlist_uploader" in x for x in cmd); assert "--write-info-json" in cmd; assert "/tmp/work/staging/album1" in cmd; assert "before_dl:__YTDLP_ITEM__=%(playlist_index|0)s/%(playlist_count|0)s" in cmd; m=app._playlist_item_re.match("[download] Downloading item 7 of 21"); assert m and m.groups()==("7","21")'
      - name: Verify playlist UI defaults and stable progress UI
        run: |
          grep -q 'id="playlist-input" type="checkbox" name="playlist" checked' templates/index.html
          grep -q 'action="/download"' templates/index.html
          grep -q '"/api/probe"' app.py
          grep -q 'openLogs' templates/index.html
          grep -q 'tracks saved' templates/index.html
          grep -q 'Supported sources' templates/index.html
          grep -q 'minmax(0,1fr)' templates/index.html
          grep -q 'overflow-x:hidden' templates/index.html
          grep -q 'PO bgutil' templates/index.html
          grep -q 'Spotify via spotDL' templates/index.html
          grep -q 'versions.spotdl' templates/index.html
          grep -q 'Resolve track' templates/index.html
          grep -q 'Retry automatic search' templates/index.html
          grep -q 'Retry / continue' templates/index.html
          grep -q 'Ignore permanently' templates/index.html
          grep -q 'Metadata required before library import' templates/index.html
          grep -q 'Move to library' templates/index.html
          grep -q 'Discard' templates/index.html
          grep -q 'Remove from list' templates/index.html
          grep -q 'Staging first:' templates/index.html
          grep -q 'JOB_REFRESH_MS = 5000' templates/index.html
          grep -q "Hint: this doesn't look like an album" templates/index.html
          grep -q 'probe hint' templates/index.html
          grep -q '/api/jobs/' templates/index.html
          grep -q 'job.source_thumbnail' templates/index.html
          grep -q 'job.metadata_album' templates/index.html
          grep -q 'job.source_title' templates/index.html
          grep -q 'job.source_album_artist' templates/index.html
          grep -q 'Open source' templates/index.html
          grep -q 'target = "_blank"' templates/index.html
          grep -q 'attempt_history' templates/index.html
          grep -q 'active_resolution_tracks' templates/index.html
          grep -q 'rel="icon"' templates/index.html
          test -s static/favicon.svg
          grep -q 'COPY static ./static' Dockerfile
      - name: Validate staged metadata gate
        run: |
          docker run --rm --user 1000:1000 \
            -e MUSIC_ROOT=/tmp/music \
            -e STATE_DIR=/tmp/state \
            -e TEMP_DIR=/tmp/work \
            yt-dlp-server:test python - <<'PY'
          import json
          import pathlib
          import subprocess
          import app
          import staging

          temp = pathlib.Path("/tmp/work")
          music = pathlib.Path("/tmp/music/YT-DLP Imports")

          # A user playlist with random uploaders must be treated as one
          # collection. Uploaders are not artists; title prefixes are a safer
          # fallback when music-specific artist metadata is absent.
          job = {
              "id": "armchair",
              "staging_owner_id": "armchair",
              "source": "yt-dlp",
              "playlist": True,
              "source_title": None,
              "source_album_artist": None,
              "force": False,
          }
          stage = staging.ensure_stage_dir(temp, job)
          infos = [
              {
                  "id": "aaa111",
                  "title": "Michael Hurley - Be Kind To Me",
                  "playlist_title": "ARMCHAIR BOOGIE",
                  "uploader": "MockyRock",
                  "album": "[Unknown Album]",
              },
              {
                  "id": "bbb222",
                  "title": "Cat Power - Werewolf",
                  "playlist_title": "ARMCHAIR BOOGIE",
                  "uploader": "Miranda",
                  "album": "[Unknown Album]",
              },
          ]
          for n, info in enumerate(infos, 1):
              (stage / f"{n:02d} - track [{info['id']}].info.json").write_text(json.dumps(info))
              (stage / f"{n:02d} - track [{info['id']}].opus").write_bytes(b"placeholder")

          analysis = staging.analyze_stage(temp, job)
          assert analysis["album"] == "ARMCHAIR BOOGIE", analysis
          assert analysis["artist"] == "", analysis
          assert analysis["needs_metadata"] is True, analysis
          assert {r["artist"] for r in analysis["records"]} == {"Michael Hurley", "Cat Power"}
          assert all("MockyRock" not in r["artist"] for r in analysis["records"])
          assert all("Miranda" not in r["artist"] for r in analysis["records"])

          # Real music artist metadata is strong enough for collection-level
          # grouping, including a genuine various-artists album.
          safe = {
              "id": "safe",
              "staging_owner_id": "safe",
              "source": "yt-dlp",
              "playlist": True,
              "source_title": "Trusted Compilation",
              "source_album_artist": None,
              "force": False,
          }
          safe_stage = staging.ensure_stage_dir(temp, safe)
          for n, (source_id, artist) in enumerate((("ddd444", "Artist A"), ("eee555", "Artist B")), 1):
              info = {
                  "id": source_id,
                  "title": f"{artist} - Track {n}",
                  "playlist_title": "Trusted Compilation",
                  "artist": artist,
                  "album": "[Unknown Album]",
              }
              (safe_stage / f"{n:02d} - track [{source_id}].info.json").write_text(json.dumps(info))
              (safe_stage / f"{n:02d} - track [{source_id}].opus").write_bytes(b"placeholder")
          safe_analysis = staging.analyze_stage(temp, safe)
          assert safe_analysis["album"] == "Trusted Compilation", safe_analysis
          assert safe_analysis["artist"] == "Various Artists", safe_analysis
          assert safe_analysis["needs_metadata"] is False, safe_analysis

          # A single item with no album must stop before the library. Use a
          # real tiny Opus file so the manual publish also exercises retagging.
          job2 = {
              "id": "manual",
              "staging_owner_id": "manual",
              "source": "yt-dlp",
              "playlist": False,
              "source_title": None,
              "source_album_artist": None,
              "force": False,
          }
          stage2 = staging.ensure_stage_dir(temp, job2)
          media = stage2 / "Track [ccc333].opus"
          subprocess.run([
              "ffmpeg", "-nostdin", "-hide_banner", "-loglevel", "error", "-y",
              "-f", "lavfi", "-i", "sine=frequency=440:duration=0.1",
              "-c:a", "libopus", str(media),
          ], check=True)
          (stage2 / "Track [ccc333].info.json").write_text(json.dumps({
              "id": "ccc333",
              "title": "Track",
              "artist": "Correct Artist",
              "album": "[Unknown Album]",
          }))

          waiting = staging.publish_stage(temp, music, job2)
          assert waiting["status"] == "needs_metadata", waiting
          assert not music.exists() or not any(music.rglob("*.opus"))
          assert media.exists(), "staged file must remain outside the library"

          published = staging.publish_stage(
              temp, music, job2,
              artist="Correct Artist",
              album="Correct Album",
          )
          assert published["status"] == "published", published
          final = music / "Correct Artist" / "Correct Album"
          files = list(final.glob("*.opus"))
          assert len(files) == 1, files
          assert not stage2.exists(), "stage should be removed only after publish"

          probe = subprocess.run([
              "ffprobe", "-v", "error", "-show_entries",
              "format_tags=album,artist", "-of", "json", str(files[0])
          ], capture_output=True, text=True, check=True)
          tags = json.loads(probe.stdout)["format"]["tags"]
          assert tags["album"] == "Correct Album", tags
          assert tags["artist"] == "Correct Artist", tags
          PY
      - name: Validate safe retagging and job discard
        run: |
          docker run --rm --user 1000:1000 \
            -e MUSIC_ROOT=/tmp/music \
            -e STATE_DIR=/tmp/state \
            -e TEMP_DIR=/tmp/work \
            yt-dlp-server:test python - <<'PY'
          import base64
          import pathlib
          import subprocess
          import tempfile

          from mutagen.flac import Picture
          from mutagen.oggopus import OggOpus

          import app
          import staging

          root = pathlib.Path(tempfile.mkdtemp())
          covered = root / "covered.opus"
          subprocess.run([
              "ffmpeg", "-nostdin", "-hide_banner", "-loglevel", "error", "-y",
              "-f", "lavfi", "-i", "sine=frequency=440:duration=0.1",
              "-c:a", "libopus", str(covered),
          ], check=True)

          audio = OggOpus(covered)
          picture = Picture()
          picture.type = 3
          picture.mime = "image/png"
          picture.desc = "cover"
          picture.data = b"not-a-real-png-but-valid-picture-metadata"
          encoded_picture = base64.b64encode(picture.write()).decode("ascii")
          audio["metadata_block_picture"] = [encoded_picture]
          audio["title"] = ["Covered track"]
          audio.save()

          before = OggOpus(covered)["metadata_block_picture"]
          staging.retag_media(
              covered,
              album="Correct Album",
              album_artist="Correct Artist",
              track_artist="Track Artist",
          )
          after = OggOpus(covered)
          assert after["album"] == ["Correct Album"], after.tags
          assert after["albumartist"] == ["Correct Artist"], after.tags
          assert after["artist"] == ["Track Artist"], after.tags
          assert after["metadata_block_picture"] == before, (
              "retagging must preserve embedded cover metadata"
          )

          # Failed/unfinished jobs can be discarded and their external staging
          # is cleaned, while completed library files are never deleted.
          app.JOBS_STATE_FILE = root / "jobs.json"
          app.TEMP_DIR = root / "tmp"
          app.jobs.clear()

          failed = {
              "id": "failed1",
              "url": "https://example.invalid/album",
              "status": "failed",
              "staging_owner_id": "failed1",
          }
          app.jobs["failed1"] = failed
          stage = staging.ensure_stage_dir(app.TEMP_DIR, failed)
          (stage / "partial.opus").write_bytes(b"partial")
          client = app.app.test_client()
          response = client.delete("/api/jobs/failed1")
          assert response.status_code == 200, response.data
          assert "failed1" not in app.jobs
          assert not stage.exists(), "discard should clean unpublished staging"

          # Removing the visible retry card removes the whole logical request,
          # not just the latest attempt (which would make its parent reappear).
          app.jobs.clear()
          parent = app.normalize_persisted_job({
              "id": "parent1",
              "url": "https://example.invalid/grouped",
              "status": "failed",
              "source": "yt-dlp",
              "staging_owner_id": "parent1",
          })
          retry = app.normalize_persisted_job({
              "id": "retry2",
              "url": "https://example.invalid/grouped",
              "status": "failed",
              "source": "yt-dlp",
              "retry_of": "parent1",
              "attempt": 2,
              "staging_owner_id": "parent1",
          })
          app.jobs.update({parent["id"]: parent, retry["id"]: retry})
          grouped_stage = staging.ensure_stage_dir(app.TEMP_DIR, parent)
          (grouped_stage / "partial.opus").write_bytes(b"partial")
          response = client.delete("/api/jobs/retry2")
          assert response.status_code == 200, response.data
          assert not app.jobs, app.jobs
