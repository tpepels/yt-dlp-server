      - name: Validate legacy repair metadata inference
        run: |
          docker run --rm --user 1000:1000 \
            -e MUSIC_ROOT=/tmp/music \
            -e STATE_DIR=/tmp/state \
            -e TEMP_DIR=/tmp/work \
            yt-dlp-server:test python - <<'PY'
          import tools.repair_legacy_imports as repair

          # Regression: a bogus generic "Release - Topic" channel must not
          # beat the real artist shared across the track credits.
          iceberg = {
              "title": "The Iceberg",
              "artist": "Release",
              "entries": [
                  {
                      "id": "aaa111",
                      "album": "The Iceberg",
                      "artist": "Oddisee",
                      "uploader": "Release - Topic",
                  },
                  {
                      "id": "bbb222",
                      "album": "The Iceberg",
                      "artist": "Oddisee, Toine",
                      "uploader": "Release - Topic",
                  },
                  {
                      "id": "ccc333",
                      "album": "The Iceberg",
                      "artist": "Oddisee, Olivier St.Louis",
                      "uploader": "Release - Topic",
                  },
              ],
          }
          artist, album, per_track, evidence = repair.collection_metadata(
              iceberg, True
          )
          assert artist == "Oddisee", (artist, evidence)
          assert album == "The Iceberg", (album, evidence)
          assert "common credited artist" in evidence["artist"], evidence
          assert set(per_track) == {"aaa111", "bbb222", "ccc333"}

          # Missing artist fields are recoverable from a stable Topic channel.
          aethiopes = {
              "title": "Aethiopes",
              "entries": [
                  {
                      "id": f"id{i:04d}",
                      "album": "Aethiopes",
                      "uploader": "billy woods - Topic",
                  }
                  for i in range(13)
              ],
          }
          artist, album, _, evidence = repair.collection_metadata(
              aethiopes, True
          )
          assert artist == "billy woods", (artist, evidence)
          assert album == "Aethiopes", (album, evidence)

          # Featured collaborators should not prevent recovering the
          # principal album artist when one credited artist is common to a
          # majority of tracks.
          featured = {
              "title": "Vulture Prince",
              "entries": [
                  {
                      "id": f"vp{i:04d}",
                      "album": "Vulture Prince",
                      "artist": (
                          "Arooj Aftab, Guest Artist"
                          if i in {1, 4}
                          else "Arooj Aftab"
                      ),
                  }
                  for i in range(7)
              ],
          }
          artist, album, _, evidence = repair.collection_metadata(
              featured, True
          )
          assert artist == "Arooj Aftab", (artist, evidence)
          assert "common credited artist" in evidence["artist"], evidence

          # If two contributors are equally ubiquitous, do not guess.
          ambiguous = {
              "title": "Duo",
              "entries": [
                  {
                      "id": f"duo{i:02d}",
                      "album": "Duo",
                      "artist": "Artist A, Artist B",
                  }
                  for i in range(8)
              ],
          }
          artist, album, _, evidence = repair.collection_metadata(
              ambiguous, True
          )
          # Exact consistency is trustworthy as the supplied album-credit
          # string, so preserve the full duo rather than arbitrarily picking A.
          assert artist == "Artist A, Artist B", (artist, evidence)

          # One populated field in a whole album is not enough evidence.
          weak = {
              "title": "Unsafe Guess",
              "entries": [
                  {
                      "id": f"weak{i:02d}",
                      "album": "Unsafe Guess",
                      "album_artist": "One Lucky Value" if i == 0 else None,
                  }
                  for i in range(10)
              ],
          }
          artist, album, _, _ = repair.collection_metadata(weak, True)
          assert artist == "", artist
          assert album == "Unsafe Guess", album

          assert repair.is_single_video_url(
              "https://music.youtube.com/watch?v=CdUT-WJVhyI"
          )
          assert not repair.is_single_video_url(
              "https://music.youtube.com/playlist?list=OLAK5uy_test"
          )

          # Repair metadata probing must be full, not flat.
          captured = []
          class Completed:
              returncode = 0
              stdout = '{"title":"Album","entries":[]}'
              stderr = ""
          real_run = repair.subprocess.run
          repair.subprocess.run = lambda cmd, **kwargs: (
              captured.extend(cmd) or Completed()
          )
          try:
              repair.probe_source(
                  "https://music.youtube.com/playlist?list=OLAK5uy_test",
                  True,
              )
          finally:
              repair.subprocess.run = real_run
          assert "--flat-playlist" not in captured, captured
          assert "--yes-playlist" in captured, captured

          # The reviewed dry-run metadata should be reused by --apply.
          import pathlib
          import tempfile
          cache = pathlib.Path(tempfile.mkdtemp())
          calls = []
          repair.subprocess.run = lambda cmd, **kwargs: (
              calls.append(cmd) or Completed()
          )
          try:
              url = "https://music.youtube.com/playlist?list=OLAK5uy_cache"
              first = repair.probe_source(url, True, cache_dir=cache)
              second = repair.probe_source(url, True, cache_dir=cache)
          finally:
              repair.subprocess.run = real_run
          assert first == second
          assert len(calls) == 1, calls
          assert list(cache.glob("*.json")), list(cache.iterdir())
          PY
