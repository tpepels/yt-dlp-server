name: Docker CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose
        run: docker compose config
      - name: Build image
        run: docker build -t yt-dlp-server:test .
      - name: Smoke-test installed tools
        run: |
          docker run --rm yt-dlp-server:test python -m py_compile /app/app.py
          docker run --rm yt-dlp-server:test yt-dlp --version
          docker run --rm yt-dlp-server:test deno --version
          docker run --rm yt-dlp-server:test ffmpeg -version
      - name: Validate non-root runtime and naming template
        run: |
          docker run --rm --user 1000:1000 \
            -e MUSIC_ROOT=/tmp/music \
            -e STATE_DIR=/tmp/state \
            -e TEMP_DIR=/tmp/work \
            yt-dlp-server:test python -c 'import app, yt_dlp; y=yt_dlp.YoutubeDL({"outtmpl": app.OUTPUT_TEMPLATE}); p=y.prepare_filename({"id":"abc123","title":"Fallback title","ext":"webm","artist":"Test Artist","album":"Test Album","track":"Test Track","track_number":1}); assert p == "Test Artist/Test Album/01 - Test Track [abc123].webm", p; q=y.prepare_filename({"id":"def456","title":"Loose Song","ext":"m4a","uploader":"Test Uploader"}); assert q == "Test Uploader/Singles/Loose Song [def456].m4a", q; print(p); print(q)'
