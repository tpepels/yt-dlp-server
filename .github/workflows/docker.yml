      - name: Validate partial Spotify playlist publishing
        run: |
          docker run --rm --user 1000:1000 \
            -e MUSIC_ROOT=/tmp/music \
            -e STATE_DIR=/tmp/state \
            -e TEMP_DIR=/tmp/work \
            yt-dlp-server:test python - <<'PY'
          import pathlib
          import queue
          import tempfile

          import app
          import staging

          root = pathlib.Path(tempfile.mkdtemp())
          app.TEMP_DIR = root / "tmp"
          app.IMPORT_ROOT = root / "library"
          app.STATE_DIR = root / "state"
          app.STATE_DIR.mkdir(parents=True)
          app.JOBS_STATE_FILE = app.STATE_DIR / "jobs.json"
          app.SPOTDL_ARCHIVE_FILE = app.STATE_DIR / "spotdl-archive.txt"
          app.download_queue = queue.Queue(maxsize=10)
          app.jobs.clear()

          playlist_url = "https://open.spotify.com/playlist/test-partial"
          failed_a = "https://open.spotify.com/track/FailTrackAAA111"
          failed_b = "https://open.spotify.com/track/FailTrackBBB222"

          job = app.normalize_persisted_job({
              "id": "partial1",
              "url": playlist_url,
              "status": "queued",
              "source": "spotify",
              "playlist": True,
              "collection_mode": True,
              "album_mode": False,
              "staging_owner_id": "partial1",
              "total_items": 4,
              "completed_items": 0,
          })
          app.jobs[job["id"]] = job

          stage = staging.ensure_stage_dir(app.TEMP_DIR, job)
          one = stage / "New Order" / "Substance" / "01 - Blue Monday [GoodTrackAAA111].opus"
          two = stage / "Soft Cell" / "Non-Stop Erotic Cabaret" / "01 - Tainted Love [GoodTrackBBB222].opus"
          one.parent.mkdir(parents=True)
          two.parent.mkdir(parents=True)
          one.write_bytes(b"one")
          two.write_bytes(b"two")

          error_a = f"{failed_a} - AudioProviderError: YT-DLP download error"
          error_b = f"{failed_b} - LookupError: No results found for song: Missing Song"

          real_popen = app.subprocess.Popen

          class FakeProcess:
              def __init__(self, command, **kwargs):
                  error_path = pathlib.Path(
                      command[command.index("--save-errors") + 1]
                  )
                  error_path.parent.mkdir(parents=True, exist_ok=True)
                  error_path.write_text(error_a + "\n" + error_b + "\n")
                  self.stdout = [
                      'INFO: Downloaded "New Order - Blue Monday": source\n',
                      'INFO: Downloaded "Soft Cell - Tainted Love": source\n',
                  ]

              def wait(self):
                  return 1

          app.subprocess.Popen = FakeProcess
          try:
              app.run_job("partial1")
          finally:
              app.subprocess.Popen = real_popen

          result = app.jobs["partial1"]
          assert result["status"] == "partial", result
          assert result["completed_items"] == 2, result
          assert result["failed_items"] == 2, result
          assert result["unidentified_failed_items"] == 0, result
          assert [m["spotify_url"] for m in result["missing_tracks"]] == [
              failed_a, failed_b
          ], result
          assert "AudioProviderError" in result["missing_tracks"][0]["reason"]
          assert "LookupError" in result["missing_tracks"][1]["reason"]

          # Successful files are published immediately, preserving each
          # Spotify track's native Album Artist / Album folders.
          final_one = (
              app.IMPORT_ROOT / "New Order" / "Substance"
              / "01 - Blue Monday [GoodTrackAAA111].opus"
          )
          final_two = (
              app.IMPORT_ROOT / "Soft Cell" / "Non-Stop Erotic Cabaret"
              / "01 - Tainted Love [GoodTrackBBB222].opus"
          )
          assert final_one.read_bytes() == b"one"
          assert final_two.read_bytes() == b"two"
          assert not stage.exists(), "successful partial files must leave staging"

          # Retry a partial job using only the failed Spotify tracks.
          client = app.app.test_client()
          response = client.post("/api/jobs/partial1/retry")
          assert response.status_code == 202, response.data
          retry = app.jobs[response.get_json()["job_id"]]
          assert retry["download_query"] == [failed_a, failed_b], retry
          assert retry["retry_base_completed"] == 2, retry
          retry_cmd = app.build_spotdl_command(retry)
          assert retry_cmd[:4] == [
              "spotdl", "download", failed_a, failed_b
          ], retry_cmd

          # If no track succeeded at all, the job remains failed rather than
          # claiming a partial publish.
          zero = app.normalize_persisted_job({
              "id": "zero1",
              "url": "https://open.spotify.com/playlist/zero",
              "status": "queued",
              "source": "spotify",
              "playlist": True,
              "staging_owner_id": "zero1",
              "total_items": 1,
          })
          app.jobs[zero["id"]] = zero

          class ZeroProcess:
              def __init__(self, command, **kwargs):
                  error_path = pathlib.Path(
                      command[command.index("--save-errors") + 1]
                  )
                  error_path.parent.mkdir(parents=True, exist_ok=True)
                  error_path.write_text(
                      failed_a + " - AudioProviderError: no audio\n"
                  )
                  self.stdout = []

              def wait(self):
                  return 1

          app.subprocess.Popen = ZeroProcess
          try:
              app.run_job("zero1")
          finally:
              app.subprocess.Popen = real_popen

          assert app.jobs["zero1"]["status"] == "failed", app.jobs["zero1"]
          assert not list(app.IMPORT_ROOT.rglob("*FailTrackAAA111*"))

          # Upgrade recovery: jobs created before this fix were persisted as
          # failed even when they had successful media in staging. The first
          # restart after upgrading must publish those files automatically.
          app.jobs.clear()
          legacy_error = (
              failed_a + " - AudioProviderError: YT-DLP download error"
          )
          legacy = app.normalize_persisted_job({
              "id": "legacy-partial",
              "url": "https://open.spotify.com/playlist/legacy",
              "status": "failed",
              "source": "spotify",
              "playlist": True,
              "staging_owner_id": "legacy-partial",
              "total_items": 2,
              "completed_items": 1,
              "failed_items": 1,
              "log": ["spotDL errors:", legacy_error],
              # Simulate the old schema where AudioProviderError was not added
              # to missing_tracks.
              "missing_tracks": [],
          })
          assert legacy["missing_tracks"][0]["spotify_url"] == failed_a, legacy
          app.jobs[legacy["id"]] = legacy
          legacy_stage = staging.ensure_stage_dir(app.TEMP_DIR, legacy)
          legacy_file = (
              legacy_stage / "New Order" / "Substance"
              / "02 - Bizarre Love Triangle [GoodTrackLegacy].opus"
          )
          legacy_file.parent.mkdir(parents=True)
          legacy_file.write_bytes(b"legacy")

          recovery = app.staged_jobs_to_finalize_after_restore()
          assert recovery == ["legacy-partial"], recovery
          assert app.jobs["legacy-partial"]["status"] == "partial"
          app.finalize_staged_job("legacy-partial")
          assert app.jobs["legacy-partial"]["status"] == "partial"
          assert not legacy_stage.exists()
          assert (
              app.IMPORT_ROOT / "New Order" / "Substance"
              / "02 - Bizarre Love Triangle [GoodTrackLegacy].opus"
          ).read_bytes() == b"legacy"
          PY
      - name: Validate Monochrome fallback track endpoint
        run: |
          docker run --rm --user 1000:1000 \
            -e MUSIC_ROOT=/tmp/music \
            -e STATE_DIR=/tmp/state \
            -e TEMP_DIR=/tmp/work \
            yt-dlp-server:test python - <<'PY'
          import pathlib
          import subprocess

          from mutagen.oggopus import OggOpus

          import app

          cmd = app.build_fallback_track_command(
              "Test Artist - Test Track",
              "/tmp/work/fallback/test",
          )
          assert cmd[:3] == ["spotdl", "download", "Test Artist - Test Track"], cmd
          ai = cmd.index("--audio")
          assert cmd[ai + 1:ai + 5] == [
              "youtube-music", "youtube", "bandcamp", "soundcloud"
          ], cmd
          assert "--archive" not in cmd, cmd
          assert cmd[cmd.index("--overwrite") + 1] == "force", cmd

          real_run = app.subprocess.run

          class Done:
              returncode = 0
              stdout = "Downloaded test fallback"

          def fake_run(command, **kwargs):
              output_template = command[command.index("--output") + 1]
              target = pathlib.Path(
                  output_template
                  .replace("{title}", "Test Track")
                  .replace("{output-ext}", "opus")
              )
              target.parent.mkdir(parents=True, exist_ok=True)
              real_run([
                  "ffmpeg", "-nostdin", "-hide_banner", "-loglevel", "error", "-y",
                  "-f", "lavfi", "-i", "sine=frequency=440:duration=0.2",
                  "-c:a", "libopus", str(target),
              ], check=True)
              audio = OggOpus(target)
              audio["title"] = ["Test Track"]
              audio["artist"] = ["Test Artist"]
              audio.save()
              return Done()

          app.subprocess.run = fake_run
          try:
              client = app.app.test_client()
              response = client.post(
                  "/api/fallback-track",
                  json={
                      "artist": "Test Artist",
                      "title": "Test Track",
                      "album": "Test Album",
                  },
              )
          finally:
              app.subprocess.run = real_run

          assert response.status_code == 200, response.data
          assert response.headers["X-Fallback-Provider"] == "spotdl"
          assert response.headers["X-Fallback-Query"] == "Test Artist - Test Track"
          assert response.data[:4] == b"OggS", response.data[:16]

          bad = client.post(
              "/api/fallback-track",
              json={"artist": "", "title": "Missing"},
          )
          assert bad.status_code == 400, bad.data
          PY
