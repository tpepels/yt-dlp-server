name: Docker CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose
        run: docker compose config
      - name: Build image
        run: docker build -t yt-dlp-server:test .
      - name: Smoke-test installed tools
        run: |
          docker run --rm yt-dlp-server:test python -m py_compile /app/app.py /app/staging.py /app/tools/repair_legacy_imports.py
          docker run --rm yt-dlp-server:test yt-dlp --version
          docker run --rm yt-dlp-server:test deno --version
          docker run --rm yt-dlp-server:test ffmpeg -version
          docker run --rm yt-dlp-server:test sh -c 'spotdl --version | grep -qx 4.5.2'
          docker run --rm --user 1000:1000 yt-dlp-server:test sh -c 'test -w "$HOME" && spotdl --version | grep -qx 4.5.2'
          docker run --rm yt-dlp-server:test python -c "import importlib.metadata; assert importlib.metadata.version('bgutil-ytdlp-pot-provider') == '2.0.0'"
          docker run --rm --user 1000:1000 yt-dlp-server:test sh -c 'test -f /opt/bgutil-ytdlp-pot-provider/server/src/generate_once.ts && deno run --allow-env --allow-net --allow-ffi=/opt/bgutil-ytdlp-pot-provider/server/node_modules --allow-write=/tmp/yt-dlp-cache/bgutil-ytdlp-pot-provider --allow-read=/tmp/yt-dlp-cache/bgutil-ytdlp-pot-provider,/opt/bgutil-ytdlp-pot-provider/server/node_modules /opt/bgutil-ytdlp-pot-provider/server/src/generate_once.ts --version | grep -qx 2.0.0'
      - name: Validate non-root runtime, naming and playlist classification
        run: |
          docker run --rm --user 1000:1000 \
            -e MUSIC_ROOT=/tmp/music \
            -e STATE_DIR=/tmp/state \
            -e TEMP_DIR=/tmp/work \
            yt-dlp-server:test python -c 'import app, yt_dlp; y=yt_dlp.YoutubeDL({"outtmpl": app.OUTPUT_TEMPLATE}); p=y.prepare_filename({"id":"abc123","title":"Fallback title","ext":"webm","artist":"Test Artist","album":"Test Album","track":"Test Track","track_number":1}); assert "/" not in p, p; assert p.endswith("Test Track [abc123].webm"), p; q=y.prepare_filename({"id":"def456","title":"Loose Song","ext":"m4a","uploader":"Test Uploader"}); assert "/" not in q and q.endswith("Loose Song [def456].m4a"), q; assert "Test Uploader" not in q; assert app.classify_probe_info({"_type":"playlist","title":"Album","playlist_count":12}) == {"kind":"playlist","title":"Album","count":12,"extractor":None,"album_mode":False,"album_artist":None}; assert app.classify_probe_info({"_type":"video","title":"Track"})["kind"] == "single"; assert app.classify_probe_info({"_type":"playlist","title":"Release"}, url="https://example.bandcamp.com/album/release")["album_mode"] is True; assert app.classify_probe_info({"_type":"playlist","title":"Mix"}, url="https://youtube.com/playlist?list=PL123")["album_mode"] is False; print(p); print(q)'
      - name: Validate album grouping and item progress
        run: |
          docker run --rm --user 1000:1000 \
            -e MUSIC_ROOT=/tmp/music \
            -e STATE_DIR=/tmp/state \
            -e TEMP_DIR=/tmp/work \
            yt-dlp-server:test python -c 'import app; u="https://www.youtube.com/playlist?list=OLAK5uy_n5KJL2xyuNKuuMogjJPznLK7ao25VhprU"; assert app.is_youtube_album_playlist(u); assert not app.is_youtube_album_playlist("https://www.youtube.com/playlist?list=PL123"); info={"entries":[{"uploader":"Artist A - Topic"},{"uploader":"Artist B - Topic"}]}; assert app.infer_album_artist(info)=="Various Artists"; j={"id":"album1","staging_owner_id":"album1","playlist":True,"album_mode":True,"compilation":True,"force":False,"url":u}; cmd=app.build_command(j); assert not any("playlist_uploader" in x for x in cmd); assert "--write-info-json" in cmd; assert "/tmp/work/staging/album1" in cmd; assert "before_dl:__YTDLP_ITEM__=%(playlist_index|0)s/%(playlist_count|0)s" in cmd; m=app._playlist_item_re.match("[download] Downloading item 7 of 21"); assert m and m.groups()==("7","21")'
      - name: Verify playlist UI defaults and stable progress UI
        run: |
          grep -q 'id="playlist-input" type="checkbox" name="playlist" checked' templates/index.html
          grep -q 'action="/download"' templates/index.html
          grep -q '"/api/probe"' app.py
          grep -q 'openLogs' templates/index.html
          grep -q 'tracks saved' templates/index.html
          grep -q 'Supported sources' templates/index.html
          grep -q 'minmax(0,1fr)' templates/index.html
          grep -q 'overflow-x:hidden' templates/index.html
          grep -q 'PO bgutil' templates/index.html
          grep -q 'Spotify via spotDL' templates/index.html
          grep -q 'versions.spotdl' templates/index.html
          grep -q 'Resolve track' templates/index.html
          grep -q 'Retry automatic search' templates/index.html
          grep -q 'Retry / continue' templates/index.html
          grep -q 'Ignore permanently' templates/index.html
          grep -q 'Metadata required before library import' templates/index.html
          grep -q 'Move to library' templates/index.html
          grep -q 'Staging first:' templates/index.html
          grep -q 'JOB_REFRESH_MS = 5000' templates/index.html
          grep -q "Hint: this doesn't look like an album" templates/index.html
          grep -q 'probe hint' templates/index.html
          grep -q '/api/jobs/' templates/index.html
      - name: Validate staged metadata gate
        run: |
          docker run --rm --user 1000:1000 \
            -e MUSIC_ROOT=/tmp/music \
            -e STATE_DIR=/tmp/state \
            -e TEMP_DIR=/tmp/work \
            yt-dlp-server:test python - <<'PY'
          import json
          import pathlib
          import subprocess
          import app
          import staging

          temp = pathlib.Path("/tmp/work")
          music = pathlib.Path("/tmp/music/YT-DLP Imports")

          # A user playlist with random uploaders must be treated as one
          # collection. Uploaders are not artists; title prefixes are a safer
          # fallback when music-specific artist metadata is absent.
          job = {
              "id": "armchair",
              "staging_owner_id": "armchair",
              "source": "yt-dlp",
              "playlist": True,
              "source_title": None,
              "source_album_artist": None,
              "force": False,
          }
          stage = staging.ensure_stage_dir(temp, job)
          infos = [
              {
                  "id": "aaa111",
                  "title": "Michael Hurley - Be Kind To Me",
                  "playlist_title": "ARMCHAIR BOOGIE",
                  "uploader": "MockyRock",
                  "album": "[Unknown Album]",
              },
              {
                  "id": "bbb222",
                  "title": "Cat Power - Werewolf",
                  "playlist_title": "ARMCHAIR BOOGIE",
                  "uploader": "Miranda",
                  "album": "[Unknown Album]",
              },
          ]
          for n, info in enumerate(infos, 1):
              (stage / f"{n:02d} - track [{info['id']}].info.json").write_text(json.dumps(info))
              (stage / f"{n:02d} - track [{info['id']}].opus").write_bytes(b"placeholder")

          analysis = staging.analyze_stage(temp, job)
          assert analysis["album"] == "ARMCHAIR BOOGIE", analysis
          assert analysis["artist"] == "", analysis
          assert analysis["needs_metadata"] is True, analysis
          assert {r["artist"] for r in analysis["records"]} == {"Michael Hurley", "Cat Power"}
          assert all("MockyRock" not in r["artist"] for r in analysis["records"])
          assert all("Miranda" not in r["artist"] for r in analysis["records"])

          # Real music artist metadata is strong enough for collection-level
          # grouping, including a genuine various-artists album.
          safe = {
              "id": "safe",
              "staging_owner_id": "safe",
              "source": "yt-dlp",
              "playlist": True,
              "source_title": "Trusted Compilation",
              "source_album_artist": None,
              "force": False,
          }
          safe_stage = staging.ensure_stage_dir(temp, safe)
          for n, (source_id, artist) in enumerate((("ddd444", "Artist A"), ("eee555", "Artist B")), 1):
              info = {
                  "id": source_id,
                  "title": f"{artist} - Track {n}",
                  "playlist_title": "Trusted Compilation",
                  "artist": artist,
                  "album": "[Unknown Album]",
              }
              (safe_stage / f"{n:02d} - track [{source_id}].info.json").write_text(json.dumps(info))
              (safe_stage / f"{n:02d} - track [{source_id}].opus").write_bytes(b"placeholder")
          safe_analysis = staging.analyze_stage(temp, safe)
          assert safe_analysis["album"] == "Trusted Compilation", safe_analysis
          assert safe_analysis["artist"] == "Various Artists", safe_analysis
          assert safe_analysis["needs_metadata"] is False, safe_analysis

          # A single item with no album must stop before the library. Use a
          # real tiny Opus file so the manual publish also exercises retagging.
          job2 = {
              "id": "manual",
              "staging_owner_id": "manual",
              "source": "yt-dlp",
              "playlist": False,
              "source_title": None,
              "source_album_artist": None,
              "force": False,
          }
          stage2 = staging.ensure_stage_dir(temp, job2)
          media = stage2 / "Track [ccc333].opus"
          subprocess.run([
              "ffmpeg", "-nostdin", "-hide_banner", "-loglevel", "error", "-y",
              "-f", "lavfi", "-i", "sine=frequency=440:duration=0.1",
              "-c:a", "libopus", str(media),
          ], check=True)
          (stage2 / "Track [ccc333].info.json").write_text(json.dumps({
              "id": "ccc333",
              "title": "Track",
              "artist": "Correct Artist",
              "album": "[Unknown Album]",
          }))

          waiting = staging.publish_stage(temp, music, job2)
          assert waiting["status"] == "needs_metadata", waiting
          assert not music.exists() or not any(music.rglob("*.opus"))
          assert media.exists(), "staged file must remain outside the library"

          published = staging.publish_stage(
              temp, music, job2,
              artist="Correct Artist",
              album="Correct Album",
          )
          assert published["status"] == "published", published
          final = music / "Correct Artist" / "Correct Album"
          files = list(final.glob("*.opus"))
          assert len(files) == 1, files
          assert not stage2.exists(), "stage should be removed only after publish"

          probe = subprocess.run([
              "ffprobe", "-v", "error", "-show_entries",
              "format_tags=album,artist", "-of", "json", str(files[0])
          ], capture_output=True, text=True, check=True)
          tags = json.loads(probe.stdout)["format"]["tags"]
          assert tags["album"] == "Correct Album", tags
          assert tags["artist"] == "Correct Artist", tags
          PY
      - name: Validate legacy repair metadata inference
        run: |
          docker run --rm --user 1000:1000 \
            -e MUSIC_ROOT=/tmp/music \
            -e STATE_DIR=/tmp/state \
            -e TEMP_DIR=/tmp/work \
            yt-dlp-server:test python - <<'PY'
          import tools.repair_legacy_imports as repair

          # Regression: a playlist-level field such as "Release" must never
          # beat stable per-track YouTube Music metadata.
          iceberg = {
              "title": "The Iceberg",
              "artist": "Release",
              "entries": [
                  {
                      "id": "aaa111",
                      "album": "The Iceberg",
                      "artist": "Oddisee",
                      "uploader": "Oddisee - Topic",
                  },
                  {
                      "id": "bbb222",
                      "album": "The Iceberg",
                      "artist": "Oddisee, Toine",
                      "uploader": "Oddisee - Topic",
                  },
                  {
                      "id": "ccc333",
                      "album": "The Iceberg",
                      "artist": "Oddisee, Olivier St.Louis",
                      "uploader": "Oddisee - Topic",
                  },
              ],
          }
          artist, album, per_track, evidence = repair.collection_metadata(
              iceberg, True
          )
          assert artist == "Oddisee", (artist, evidence)
          assert album == "The Iceberg", (album, evidence)
          assert "Topic" in evidence["artist"], evidence
          assert set(per_track) == {"aaa111", "bbb222", "ccc333"}

          # Missing artist fields are recoverable from a stable Topic channel.
          aethiopes = {
              "title": "Aethiopes",
              "entries": [
                  {
                      "id": f"id{i:04d}",
                      "album": "Aethiopes",
                      "uploader": "billy woods - Topic",
                  }
                  for i in range(13)
              ],
          }
          artist, album, _, evidence = repair.collection_metadata(
              aethiopes, True
          )
          assert artist == "billy woods", (artist, evidence)
          assert album == "Aethiopes", (album, evidence)

          # One populated field in a whole album is not enough evidence.
          weak = {
              "title": "Unsafe Guess",
              "entries": [
                  {
                      "id": f"weak{i:02d}",
                      "album": "Unsafe Guess",
                      "album_artist": "One Lucky Value" if i == 0 else None,
                  }
                  for i in range(10)
              ],
          }
          artist, album, _, _ = repair.collection_metadata(weak, True)
          assert artist == "", artist
          assert album == "Unsafe Guess", album

          assert repair.is_single_video_url(
              "https://music.youtube.com/watch?v=CdUT-WJVhyI"
          )
          assert not repair.is_single_video_url(
              "https://music.youtube.com/playlist?list=OLAK5uy_test"
          )

          # Repair metadata probing must be full, not flat.
          captured = []
          class Completed:
              returncode = 0
              stdout = '{"title":"Album","entries":[]}'
              stderr = ""
          real_run = repair.subprocess.run
          repair.subprocess.run = lambda cmd, **kwargs: (
              captured.extend(cmd) or Completed()
          )
          try:
              repair.probe_source(
                  "https://music.youtube.com/playlist?list=OLAK5uy_test",
                  True,
              )
          finally:
              repair.subprocess.run = real_run
          assert "--flat-playlist" not in captured, captured
          assert "--yes-playlist" in captured, captured
          PY
      - name: Validate persistent queue state
        run: |
          docker run --rm --user 1000:1000 \
            -e MUSIC_ROOT=/tmp/music \
            -e STATE_DIR=/tmp/state \
            -e TEMP_DIR=/tmp/work \
            yt-dlp-server:test python -c 'import json, tempfile, pathlib, app; now=123.0; raw=[{"id":"q1","url":"https://youtube.com/playlist?list=PL123","status":"queued","playlist":True,"message":"Waiting","created_at":1},{"id":"r1","url":"https://youtube.com/watch?v=abc","status":"running","playlist":False,"message":"Downloading","created_at":2},{"id":"sp2","url":"https://open.spotify.com/album/abc","status":"failed","source":"spotify","attempt":2,"completed_items":6,"total_items":7,"message":"Partial","created_at":3}]; p=pathlib.Path(tempfile.mkdtemp())/"jobs.json"; p.write_text(json.dumps(raw), encoding="utf-8"); app.JOBS_STATE_FILE=p; app.jobs.clear(); ids=app.load_persisted_jobs(); assert ids==["q1"], ids; assert app.jobs["q1"]["status"]=="queued"; assert app.jobs["r1"]["status"]=="failed"; assert "Interrupted by server restart" in app.jobs["r1"]["message"]; assert app.jobs["sp2"]["retry_base_completed"]==6; saved=json.loads(p.read_text()); assert saved["version"]==1 and len(saved["jobs"])==3; app.jobs["q1"]["status"]="succeeded"; app.persist_jobs(); saved2=json.loads(p.read_text()); assert any(j["id"]=="q1" and j["status"]=="succeeded" for j in saved2["jobs"])'
      - name: Validate unavailable YouTube track ignore
        run: |
          docker run --rm --user 1000:1000 \
            -e MUSIC_ROOT=/tmp/music \
            -e STATE_DIR=/tmp/state \
            -e TEMP_DIR=/tmp/work \
            yt-dlp-server:test python -c 'import json, pathlib, tempfile, time, app; d=pathlib.Path(tempfile.mkdtemp()); app.IGNORED_TRACKS_FILE=d/"ignored-tracks.json"; app.JOBS_STATE_FILE=d/"jobs.json"; app.jobs.clear(); log=["WARNING: [youtube:tab] YouTube said: INFO - 1 unavailable video is hidden","ERROR: [youtube] riu2Bx6miIU: Video unavailable"]; missing=app.extract_youtube_missing_tracks(log, {}); assert missing==[{"source":"youtube","source_id":"riu2Bx6miIU","label":"YouTube video riu2Bx6miIU","reason":"Video unavailable","ignored":False}], missing; app.jobs["j"]={"id":"j","url":"https://music.youtube.com/playlist?list=PLCB8D47FCA386F615","source":"yt-dlp","status":"failed","playlist":True,"album_mode":False,"compilation":False,"force":False,"message":"yt-dlp exited with code 1","progress":"","current_item":14,"total_items":14,"completed_items":13,"files":[],"log":log,"created_at":time.time(),"started_at":None,"finished_at":time.time(),"returncode":1,"http_403":False,"retry_of":None,"attempt":3,"retry_base_completed":0,"failed_items":1,"missing_tracks":missing,"resolution_of":None,"spotify_track_url":None,"manual_source_url":None,"download_query":None}; client=app.app.test_client(); r=client.post("/api/jobs/j/ignore", json={"source_id":"riu2Bx6miIU"}); assert r.status_code==200, r.data; j=app.jobs["j"]; assert j["status"]=="succeeded"; assert "13/14 tracks saved; 1 ignored" in j["message"], j["message"]; state=json.loads(app.IGNORED_TRACKS_FILE.read_text()); assert "youtube:riu2Bx6miIU" in state; restored=app.normalize_persisted_job({"id":"old","url":"https://music.youtube.com/playlist?list=PLCB8D47FCA386F615","status":"failed","source":"yt-dlp","playlist":True,"completed_items":13,"total_items":14,"log":log}); assert restored["missing_tracks"][0]["ignored"] is True; assert restored["status"]=="succeeded"'
      - name: Validate failed-job retry continuation
        run: |
          docker run --rm --user 1000:1000 \
            -e MUSIC_ROOT=/tmp/music \
            -e STATE_DIR=/tmp/state \
            -e TEMP_DIR=/tmp/work \
            yt-dlp-server:test python -c 'import queue, time, app; app.download_queue=queue.Queue(maxsize=5); app.jobs.clear(); app.jobs["old"]={"id":"old","url":"https://youtube.com/playlist?list=PL123","playlist":True,"album_mode":False,"compilation":False,"force":False,"status":"failed","message":"failed","progress":"100%","current_item":2,"total_items":21,"completed_items":1,"files":["/data/music/a.opus"],"log":[],"created_at":time.time(),"started_at":None,"finished_at":time.time(),"returncode":1,"http_403":True,"retry_of":None,"attempt":1}; client=app.app.test_client(); r=client.post("/api/jobs/old/retry"); assert r.status_code==202, r.data; new_id=r.get_json()["job_id"]; new=app.jobs[new_id]; assert new["status"]=="queued"; assert new["completed_items"]==1 and new["total_items"]==21; assert new["files"]==["/data/music/a.opus"]; assert new["force"] is False; assert new["retry_of"]=="old" and new["attempt"]==2; assert client.post("/api/jobs/old/retry").status_code==409'
      - name: Validate Spotify spotDL integration
        run: |
          docker run --rm --user 1000:1000 \
            -e MUSIC_ROOT=/tmp/music \
            -e STATE_DIR=/tmp/state \
            -e TEMP_DIR=/tmp/work \
            yt-dlp-server:test python -c 'import queue, app; u="https://open.spotify.com/album/4yP0hdKOZPNshxUOjY0cZj"; assert app.is_spotify_url(u); assert app.spotify_link_type(u)=="album"; j={"id":"sp1","staging_owner_id":"sp1","url":u,"force":False,"download_query":None}; cmd=app.build_spotdl_command(j); assert cmd[:3]==["spotdl","download",u]; ai=cmd.index("--audio"); assert cmd[ai+1:ai+5]==["youtube-music","youtube","bandcamp","soundcloud"]; assert "--archive" in cmd and str(app.SPOTDL_ARCHIVE_FILE) in cmd; assert "--format" in cmd and "opus" in cmd; assert "--bitrate" in cmd and "disable" in cmd; assert app.library_staging.staged_spotdl_output_template(app.TEMP_DIR, j).endswith("{track-number} - {title} [{track-id}].{output-ext}"); assert "/tmp/work/staging/sp1/" in app.library_staging.staged_spotdl_output_template(app.TEMP_DIR, j); assert "youtube:player_client=mweb" in app.spotdl_ytdlp_args(); assert "youtubepot-bgutilscript:server_home=" in app.spotdl_ytdlp_args(); force=app.build_spotdl_command({"id":"sp2","staging_owner_id":"sp2","url":u,"force":True}); assert "--archive" not in force; assert force[force.index("--overwrite")+1]=="force"; app.jobs.clear(); app.jobs["sp"]={"id":"sp","source":"spotify","completed_items":0,"total_items":0,"current_item":0,"retry_base_completed":0,"message":"","progress":"","files":[],"log":[],"http_403":False}; app.append_log("sp","INFO: 1/8 complete"); assert app.jobs["sp"]["total_items"]==8 and app.jobs["sp"]["current_item"]==1; app.append_log("sp", "INFO: Downloaded \"Artist - Track\": https://youtube.com/watch?v=x"); assert app.jobs["sp"]["completed_items"]==1; err="https://open.spotify.com/track/4EIGit0b2tPnfp4jPdrtKZ - LookupError: No results found for song: GAS - Pop 3"; missing=app.extract_spotdl_missing_tracks([err]); assert missing==[{"spotify_url":"https://open.spotify.com/track/4EIGit0b2tPnfp4jPdrtKZ","label":"GAS - Pop 3","resolved":False,"source_url":None}]; assert app.is_manual_spotify_source_url("https://kompakt-gas.bandcamp.com/track/pop-3"); assert app.is_manual_spotify_source_url("https://www.youtube.com/watch?v=abc123"); assert not app.is_manual_spotify_source_url("https://example.com/audio"); app.download_queue=queue.Queue(maxsize=5); app.jobs.clear(); app.jobs["parent"]={"id":"parent","source":"spotify","status":"failed","missing_tracks":missing,"total_items":7,"completed_items":6,"current_item":7,"progress":"","failed_items":1,"log":[]}; client=app.app.test_client(); rr=client.post("/api/jobs/parent/resolve", json={"spotify_url":missing[0]["spotify_url"],"source_url":"https://kompakt-gas.bandcamp.com/track/pop-3"}); assert rr.status_code==202, rr.data; child=app.jobs[rr.get_json()["job_id"]]; assert child["download_query"]=="https://kompakt-gas.bandcamp.com/track/pop-3|https://open.spotify.com/track/4EIGit0b2tPnfp4jPdrtKZ"; assert child["resolution_of"]=="parent"; child["completed_items"]=1; app.apply_manual_resolution_success(child); assert app.jobs["parent"]["status"]=="succeeded"; assert app.jobs["parent"]["completed_items"]==7; assert app.jobs["parent"]["missing_tracks"][0]["resolved"] is True; p=client.post("/api/probe", json={"url":u}); assert p.status_code==200 and p.get_json()["kind"]=="spotify" and p.get_json()["is_album"] is True; t=client.post("/api/probe", json={"url":"https://open.spotify.com/track/4EIGit0b2tPnfp4jPdrtKZ"}); assert t.status_code==200 and t.get_json()["kind"]=="spotify" and t.get_json()["is_album"] is False'
      - name: Validate YouTube PO-token command wiring
        run: |
          docker run --rm --user 1000:1000 \
            -e MUSIC_ROOT=/tmp/music \
            -e STATE_DIR=/tmp/state \
            -e TEMP_DIR=/tmp/work \
            yt-dlp-server:test python -c 'import app; u="https://youtube.com/watch?v=df6l0NnHOTw"; args=app.youtube_extractor_args(u); assert "youtube:player_client=mweb" in args; assert any(x.startswith("youtubepot-bgutilscript:server_home=") for x in args); assert app.VERSIONS["bgutil"]=="2.0.0"; assert app.BGUTIL_SERVER_HOME.is_dir()'
